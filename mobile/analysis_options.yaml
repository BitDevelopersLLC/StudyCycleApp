# Static analysis for Study Cycle.
# Starts from the official Flutter lints and adds stricter rules for a public codebase.
# Run with `flutter analyze`. CI and contributors should keep it at zero issues.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_await_in_return
    - use_super_parameters

formatter:
  page_width: 100
